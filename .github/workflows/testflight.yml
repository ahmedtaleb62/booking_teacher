name: Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-ios:
    name: Build iOS & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter ───────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      # ── 3. Cache pub packages ────────────────────────────────────
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 4. Cache CocoaPods ───────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        timeout-minutes: 20

      # ── 5. Firebase iOS config ───────────────────────────────────
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          echo "$GOOGLE_SERVICE_INFO" | base64 --decode > ios/Runner/GoogleService-Info.plist

      # ── 6. Code signing ──────────────────────────────────────────
      - name: Import certificate & provisioning profile
        env:
          P12_BASE64:        ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD:      ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64:    ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          CERT=$RUNNER_TEMP/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$P12_BASE64" | base64 --decode -o "$CERT"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision

      # ── 7. Inject team ID ────────────────────────────────────────
      - name: Set Apple Team ID in ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CLEAN_TEAM_ID=$(echo "${TEAM_ID}" | tr -d '[:space:]')
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${CLEAN_TEAM_ID}/g" ios/ExportOptions.plist

      # ── 8. Build IPA ─────────────────────────────────────────────
      - name: Build Flutter IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
        timeout-minutes: 30

      # ── 9. Upload to TestFlight ──────────────────────────────────
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          CLEAN_KEY_ID=$(echo "${ASC_KEY_ID}" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "${ASC_ISSUER_ID}" | tr -d '[:space:]')

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file $(find build/ios/ipa -name "*.ipa" | head -1) \
            --apiKey  "$CLEAN_KEY_ID" \
            --apiIssuer "$CLEAN_ISSUER_ID" \
            --verbose

      # ── 10. Cleanup ──────────────────────────────────────────────
      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain || true
