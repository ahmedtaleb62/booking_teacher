name: Deploy to TestFlight

on:
  push:
    branches: [main]        # يُطلق تلقائياً عند كل push على main
  workflow_dispatch:         # أو يدوياً من GitHub → Actions

jobs:
  deploy-ios:
    name: Build iOS & Upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter ───────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 3. Firebase iOS config ───────────────────────────────────
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          echo "$GOOGLE_SERVICE_INFO" | base64 --decode \
            > ios/Runner/GoogleService-Info.plist

      # ── 4. Code signing ─────────────────────────────────────────
      - name: Import certificate & provisioning profile
        env:
          P12_BASE64:          ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD:        ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64:      ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD:   ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          CERT=$RUNNER_TEMP/cert.p12

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Import distribution certificate
          echo "$P12_BASE64" | base64 --decode -o "$CERT"
          security import "$CERT" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision

      # ── 5. Inject team ID into ExportOptions ────────────────────
      - name: Set Apple Team ID in ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${TEAM_ID}/g" ios/ExportOptions.plist

      # ── 6. Build IPA ─────────────────────────────────────────────
      - name: Build Flutter IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      # ── 7. Upload to TestFlight ──────────────────────────────────
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file $(find build/ios/ipa -name "*.ipa" | head -1) \
            --apiKey  "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      # ── 8. Cleanup ───────────────────────────────────────────────
      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain || true
