org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=2
android.useAndroidX=true
android.nativeLibrary.padded16kpagesize=true
# Disable ART baseline profile merging — workaround for Gradle 8.14 metadata.bin bug with large React Native AARs (Jitsi)
android.enableMergingArtProfiles=false
