workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      flutter: 3.44.2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Write GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
            > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Set up code signing
        script: |
          KEYCHAIN=$CM_BUILD_DIR/build.keychain
          CERT=$CM_BUILD_DIR/cert.p12

          security create-keychain -p "codemagic" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "codemagic" "$KEYCHAIN"

          echo "$IOS_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$CERT"
          security import "$CERT" -P "codemagic" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "codemagic" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          # Download provisioning profile directly from Apple API
          app-store-connect fetch-signing-files com.example.teacherBooking \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles

          echo "=== Verify ==="
          security find-identity -v -p codesigning
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "No profiles dir"

      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: cd ios && pod install

      - name: Flutter build iOS
        script: flutter build ios --release --no-codesign

      - name: Build IPA
        script: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/PCRTCYJKP2/g" ios/ExportOptions.plist

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Runner.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="HajezUstad AppStore" \
            DEVELOPMENT_TEAM=PCRTCYJKP2

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Runner.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist ios/ExportOptions.plist

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
