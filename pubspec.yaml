name: teacher_booking
description: "Hessati — منصة حجز دروس خصوصية"
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.9.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  dotted_border: ^2.1.0

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.4

  # WebView (Jitsi live sessions)
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.0

  # Audio: in-app voice recording and playback
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5

  # Open file/image URLs in external browser
  url_launcher: ^6.3.1

  # Open system notification/app settings
  app_settings: ^5.1.1

  # Save images / files to device gallery & storage
  gal: ^1.3.2

  # Firebase (push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Pin device_info_plus to avoid isiOSAppOnVision compile error in 12.4.0
  device_info_plus: '>=9.0.0 <11.0.0'

  # HTTP client (for ChinguiSoft OTP API)
  http: ^1.2.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Hessati.logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
